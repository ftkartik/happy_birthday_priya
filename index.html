<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="snap-container">
    <section class="hero">
      <div class="hero-inner">
        <h1>Happy Birthday!</h1>
        <p class="sub">For the brightest future doctor — swipe/scroll to read something cheeky 😉</p>
      </div>
    </section>

    

    <section class="footer">
      <div class="hero-inner">
        <h2>You up for a date on saturday (13-06-2026)?</h2>
        <div class="button-group">
          <button id="yesBtn" class="btn-yes">Yes</button>
          <button id="nahBtn" class="btn-nah">Nah, I got to study</button>
        </div>
      </div>
    </section>
  </main>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/main.js" type="module"></script>
</body>
</html>
